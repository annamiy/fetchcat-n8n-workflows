<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f8f3"/><style>.title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#11130f}.sub{font-family:Arial,sans-serif;font-size:14px;font-weight:400;fill:#62685d}.box{fill:#fff;stroke:#d3d8cc;stroke-width:2}.head{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#11130f}.meta{font-family:Arial,sans-serif;font-size:13px;font-weight:600;fill:#62685d}.body{font-family:Arial,sans-serif;font-size:14px;font-weight:400;fill:#11130f}.why{font-family:Arial,sans-serif;font-size:14px;font-weight:600;fill:#11130f}.accent{fill:#d9f23f}.count{font-family:Arial,sans-serif;font-size:14px;font-weight:600;fill:#11130f}</style>
  <text x="55" y="52" class="title">Telegram channel intelligence</text><text x="55" y="78" class="sub">Verified QA digest: five highest-scoring items, with full evidence saved in Google Sheets</text>
  <g transform="translate(55 110)"><rect width="1090" height="170" rx="8" class="box"/><rect width="9" height="170" class="accent"/><text x="30" y="38" class="head">1. Telegram bot-to-bot communication</text><text x="30" y="65" class="meta">@durov | HIGH | 92/100</text><text x="30" y="98" class="body">Telegram added bot-to-bot communication, enabling autonomous agent workflows.</text><text x="30" y="130" class="why">Why it matters: A major platform capability for AI and automation products.</text></g>
  <g transform="translate(55 300)"><rect width="1090" height="170" rx="8" class="box"/><rect width="9" height="170" class="accent"/><text x="30" y="38" class="head">2. Inbox automation via bots</text><text x="30" y="65" class="meta">@durov | HIGH | 90/100</text><text x="30" y="98" class="body">Users can assign a bot to read and reply with granular access controls.</text><text x="30" y="130" class="why">Why it matters: This can change how people and businesses manage communications.</text></g>
  <g transform="translate(55 490)"><rect width="1090" height="170" rx="8" class="box"/><rect width="9" height="170" class="accent"/><text x="30" y="38" class="head">3. Managed bots without coding</text><text x="30" y="65" class="meta">@telegram | HIGH | 87/100</text><text x="30" y="98" class="body">Telegram introduced managed bots that can be launched without coding.</text><text x="30" y="130" class="why">Why it matters: It lowers adoption barriers for non-technical automation users.</text></g>
  <rect x="55" y="690" width="1090" height="42" rx="6" class="accent"/><text x="78" y="717" class="count">+13 additional relevant posts saved in the sortable Google Sheets evidence table</text>
</svg>
