  <rect width="1800" height="760" fill="#f7f8f3"/><style>.title{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#11130f}.sub{font-family:Arial,sans-serif;font-size:15px;font-weight:400;fill:#62685d}.group{fill:#fff;stroke:#d3d8cc;stroke-width:2}.gt{font-family:Arial,sans-serif;font-size:15px;font-weight:600;fill:#11130f}.node{fill:#fff;stroke:#9aa291;stroke-width:2}.label{font-family:Arial,sans-serif;font-size:12px;font-weight:500;fill:#11130f}.line{stroke:#838b7d;stroke-width:3}.accent{fill:#d9f23f}.num{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#11130f}.bar{fill:#11130f}.bartext{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#d9f23f}</style>
